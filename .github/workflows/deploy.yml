name: Build and deploy Spendly
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Compile the C++ financial engine
        run: emcc src/spendly.cpp -O2 -s WASM=1 -s MODULARIZE=1 -s EXPORT_NAME=createSpendlyModule -s EXPORTED_FUNCTIONS='["_resetLedger","_addLedgerTransaction","_getLedgerIncome","_getLedgerExpenses","_getLedgerBalance","_getLedgerSavingsRate","_getLedgerCount","_calculateBudgetRemaining","_calculateGoalProgress","_validateAmount"]' -s EXPORTED_RUNTIME_METHODS='["cwrap"]' -o spendly.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4