name: Build and deploy Spendly
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Compile C++ application to WebAssembly
        run: |
          mkdir -p public
          em++ web_core.cpp -std=c++17 -O2 --bind \
            -s MODULARIZE=1 -s EXPORT_ES6=1 -s ENVIRONMENT=web \
            -s ALLOW_MEMORY_GROWTH=1 \
            -o spendly.js
      - name: Assemble website
        run: |
          cp index.html styles.css app.js privacy.html terms.html spendly.js spendly.wasm public/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
